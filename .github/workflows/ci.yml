name: CI

# 目的：把"能不能编译、测试过不过"从 2C2G 的服务器挪到 GitHub 的 runner 上。
# 服务器上跑 go build 曾两次把内存吃光导致整机卡死，这里接手那道关卡。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行，推送频繁时不浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # gofmt 是硬性检查：仓库已统一为 LF（见 .gitattributes），
      # 所以 gofmt -l 在 CI 与本地都应该零输出。
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请本地执行 gofmt -w"
            echo "$unformatted"
            exit 1
          fi
          echo "所有 Go 文件都通过 gofmt"

  # 产出可直接部署的 linux/amd64 二进制，避免在 2C2G 的服务器上编译。
  # 服务器上下载方式见 SERVER.md（用 GitHub API 取 run 的 artifact）。
  build-artifacts:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/yiuk-platform-core ./cmd/platform-core
          go build -trimpath -o dist/yiuk-platform-gateway ./cmd/platform-gateway
          go build -trimpath -o dist/yiuk-mcp ./cmd/yiuk-mcp
          cd dist && sha256sum yiuk-platform-core yiuk-platform-gateway yiuk-mcp > SHA256SUMS && cat SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agentremote-linux-amd64
          path: dist/
          retention-days: 14

  # Windows 客户端：Qt + MinGW 构建，跑 CTest（不需要真桌面；真机验收会自行 SKIP）。
  #
  # 为什么要放 CI：本机才能编译曾经是最大的盲区——Qt 侧改坏了要等人手动跑。
  # OpenCV 的静态构建不进仓库（约 100 MB 中间产物），所以按版本号缓存在 runner 上，
  # 缓存命中时只做配置，命中不了再花 ~2 分钟从源码构建。
  windows-qt:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_VERSION: 6.11.1
      OPENCV_VERSION: 4.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Qt (MinGW) and the matching toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Cache the static OpenCV build
        uses: actions/cache@v4
        with:
          path: spike/vision/third_party/install-opencv
          key: opencv-${{ env.OPENCV_VERSION }}-mingw1310-staticlist-core-imgproc-v1

      - name: Build OpenCV (cache miss only)
        shell: pwsh
        run: |
          if (Test-Path "spike/vision/third_party/install-opencv/x64/mingw/staticlib/OpenCVConfig.cmake") {
            Write-Host "OpenCV static build restored from cache"
            exit 0
          }
          git clone --depth 1 --branch $env:OPENCV_VERSION https://github.com/opencv/opencv.git spike/vision/third_party/opencv-src
          cmake -S spike/vision/third_party/opencv-src -B spike/vision/third_party/build-opencv -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_LIST=core,imgproc -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF `
            -DBUILD_EXAMPLES=OFF -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_JPEG=OFF -DWITH_PNG=OFF `
            -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_PROTOBUF=OFF -DWITH_ADE=OFF -DCPU_DISPATCH=
          cmake --build spike/vision/third_party/build-opencv --parallel
          cmake --install spike/vision/third_party/build-opencv

      - name: Configure
        run: cmake -S qt-client -B qt-client/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DYIUK_BUILD_TESTS=ON

      - name: Build (client, panel, MCP helper and the tests)
        run: cmake --build qt-client/build-ci --parallel

      - name: CTest
        timeout-minutes: 15
        working-directory: qt-client/build-ci
        run: ctest --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qt-test-logs
          path: qt-client/build-ci/Testing/
          retention-days: 7
          if-no-files-found: ignore
