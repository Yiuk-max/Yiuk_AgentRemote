# AgentRemote 平台服务配置

# 部署时复制为 platform.yaml 并设置为仅服务账户可读写。player_password 使用
# devices 的临时密码不写入本文件。
platform:
  # WebSocket/WSS
  listen: ":25664"
  tls_cert: "server.crt"
  tls_key: "server.key"
  # 仅本地开发/测试可设为 true 以启用明文监听；生产环境必须为 false。
  allow_insecure: false
  player_password: "REPLACE_WITH_A_LONG_RANDOM_PLAYER_SECRET"

  max_connections: 1024
  max_devices: 1024
  max_sessions: 2048
  max_sessions_per_device: 8
  max_tasks_per_session: 2

  session_timeout_sec: 600
  approval_timeout_sec: 120
  temp_password_ttl_sec: 600
  temporary_password_min_sec: 60
  temporary_password_max_sec: 86400
  heartbeat_timeout_sec: 45
  handshake_timeout_sec: 10
  max_output_bytes: 2097152
  # 单次远端文件下载上限（字节）。设备端和 MCP 客户端同样按 32 MiB 限制。
  max_download_bytes: 33554432
  # 单次上传到设备的上限（字节）；设备端与 MCP 客户端同样按 32 MiB 限制。
  max_upload_bytes: 33554432
  max_frame_bytes: 262144
  auth_rate_per_min: 30
  # 设备注册频率（每分钟，按来源 IP）。注册发生在认证之后，auth_rate_per_min 覆盖不到；
  # 密码不匹配时服务端会分配新设备码，因此每次注册都可能新建条目。
  register_rate_per_min: 30
  offline_device_keep_sec: 86400
  # 从未建立过会话的设备离线多久后释放（秒），0 表示不启用。
  # 释放只把码挪进墓碑，原设备仍可凭旧密码 reclaim 自己的码。
  unused_device_release_sec: 600

  log_file: "platform.log"

  # —— 拆成两个进程时使用的内网 gRPC 地址（单进程 cmd/platform 模式不用）——
  # 两个进程读同一份配置，各自只取自己那一侧的两项。
  # core 进程：gRPC 监听，提供 Edge 服务（gateway 把帧送上来）
  core_grpc_listen: ":25670"
  # gateway 进程：连 core 的地址
  core_grpc_addr: "127.0.0.1:25670"
  # gateway 进程：gRPC 监听，提供 Push 服务（core 把出站帧送回来）
  gateway_grpc_listen: ":25671"
  # core 进程：连 gateway 的地址（也是路由查不到时的兜底投递地址）
  gateway_grpc_addr: "127.0.0.1:25671"

  # —— Redis：只记录“谁在哪”，不存 socket、不存业务状态 ——
  # 网关存活、连接归属、设备路由都写在这里，键都带 TTL，由网关定时续期。
  redis_addr: "127.0.0.1:6379"
  redis_password: ""
  redis_db: 0
  # 路由键 TTL（秒），网关按 1/3 周期续期；进程被强杀后最多这么久路由才失效。
  # 多网关时每个 gateway 用不同的 gateway_id。
  route_ttl_sec: 30
  gateway_id: "gw-1"
